<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PUNKS QIX</title>
  <meta name="description" content="黄色モヒカンのパンクスが、うねる機動隊の群衆をかわして線を引き、陣地を広げる陣取りアクション。" />
  <!-- ドット文字: 英数字は Press Start 2P、日本語は DotGothic16 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>PUNKS QIX <span>パンクス・クイックス</span></h1>
  <!-- 内部解像度 480x448。CSS で画面に合わせて拡大する -->
  <canvas id="game" width="480" height="448" tabindex="0" aria-label="ゲーム画面"></canvas>
  <p class="help">↑↓←→ 移動 ・ SPACE(押しながら)線を引く ・ ENTER 開始 ・ M 音 ON/OFF</p>

  <!-- スマホ用のボタン(タッチ操作の端末でだけ表示) -->
  <div class="touch" aria-hidden="true">
    <div class="pad">
      <button data-key="up" class="b-up">▲</button>
      <button data-key="left" class="b-left">◀</button>
      <button data-key="right" class="b-right">▶</button>
      <button data-key="down" class="b-down">▼</button>
    </div>
    <button data-key="draw" class="b-draw">DRAW</button>
  </div>

  <p class="back"><a href="../../">← ゲーム一覧へ</a></p>

  <!-- キャラクターのドット絵はドンキーパンクのデータを再利用する(DP.sprites) -->
  <script src="../donkeypunk/js/sprites.js"></script>
  <!-- 読み込み順に意味がある(後のファイルが前のファイルを使う) -->
  <script src="js/config.js"></script>
  <script src="js/punk-views.js"></script>
  <script src="js/hair.js"></script>
  <script src="js/field.js"></script>
  <script src="js/player.js"></script>
  <script src="js/crowd.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/dev-tools.js"></script>
  <script src="js/main.js"></script>
  <script src="js/test-hooks.js"></script>
</body>
</html>
