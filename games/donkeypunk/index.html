<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ドンキーパンク</title>
  <meta name="description" content="赤モヒカンのパンクスが鉄骨とハシゴを登り、ゴリラ警官が転がすビール瓶・缶をよけてスキンヘッドガールを救う固定画面アクション。" />
  <!-- ドット文字: 英数字は Press Start 2P、日本語は DotGothic16 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>DONKEY PUNK <span>ドンキーパンク</span></h1>
  <!-- 内部解像度 480x560。CSS で画面に合わせて拡大する -->
  <canvas id="game" width="480" height="560" tabindex="0" aria-label="ゲーム画面"></canvas>
  <p class="help">← → 移動 ・ ↑ ↓ ハシゴ ・ SPACE ジャンプ ・ ENTER 開始/再挑戦 ・ M 音 ON/OFF</p>
  <p class="back"><a href="../../">← ゲーム一覧へ</a></p>

  <!-- 読み込み順に意味がある(後のファイルが前のファイルを使う) -->
  <script src="js/config.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/stages/stage1.js"></script>
  <script src="js/stages/stage2.js"></script>
  <script src="js/stages/stage3.js"></script>
  <script src="js/stages/stage4.js"></script>
  <script src="js/input.js"></script>
  <script src="js/music.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/player.js"></script>
  <script src="js/hazards.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/collapse.js"></script>
  <script src="js/intermission.js"></script>
  <script src="js/skulls.js"></script>
  <script src="js/cops.js"></script>
  <script src="js/birds.js"></script>
  <script src="js/bazooka.js"></script>
  <script src="js/mechanics.js"></script>
  <script src="js/game.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/test-hooks.js"></script>
  <script src="js/dev-tools.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
