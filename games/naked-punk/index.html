<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NAKED PUNK</title>
  <meta name="description" content="ライブ中に裸になったパンクスが、警察官と機動隊から逃げながら服を集める迷路アクション。" />
  <!-- ドット文字: 英数字は Press Start 2P、日本語は DotGothic16 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>NAKED PUNK</h1>
  <!-- 内部解像度 336x392(縦長)。CSS で画面に合わせて拡大する -->
  <canvas id="game" width="336" height="392" tabindex="0" aria-label="ゲーム画面"></canvas>
  <p class="help">↑↓←→ 移動 ・ ENTER 開始 ・ M 音 ON/OFF</p>

  <!-- スマホ用のボタン(タッチ操作の端末でだけ表示)。押した向きへ進み続ける -->
  <div class="touch">
    <div class="pad" aria-label="タッチ操作">
      <button type="button" data-key="up" class="b-up">▲</button>
      <button type="button" data-key="left" class="b-left">◀</button>
      <button type="button" data-key="right" class="b-right">▶</button>
      <button type="button" data-key="down" class="b-down">▼</button>
    </div>
    <button type="button" id="sound-toggle">音: ON</button>
  </div>

  <p class="back"><a href="../../">← ゲーム一覧へ</a></p>

  <!-- ドット絵は既存のゲームから読み込む(どちらも変更しない):
       主人公の横向き・警察官・機動隊員・ビール瓶はドンキーパンク(DP.sprites)、主人公の正面・背面は PUNKS QIX(PunkViews) -->
  <script src="../donkeypunk/js/sprites.js"></script>
  <script src="../punks-qix/js/punk-views.js"></script>
  <!-- 読み込み順に意味がある(後のファイルが前のファイルを使う) -->
  <script src="js/config.js"></script>
  <script src="js/maze.js"></script>
  <script src="js/outfit.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/intruders.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/dev-tools.js"></script>
  <script src="js/main.js"></script>
  <script src="js/test-hooks.js"></script>
</body>
</html>
